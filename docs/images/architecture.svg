<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="t">
  <title id="t">cotcha-pinch architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', Verdana, sans-serif; fill: #1E293B; }
      .h { font-size: 17px; font-weight: 700; }
      .s { font-size: 13px; fill: #334155; }
      .xs { font-size: 12px; fill: #475569; }
      .tag { font-size: 12px; font-weight: 700; fill: #FFFFFF; }
      .note { font-size: 12px; fill: #64748B; font-style: italic; }
    </style>
  </defs>
  <rect x="0" y="0" width="960" height="700" rx="18" fill="#FFFFFF"/>

  <!-- 브레인: Claude Code -->
  <rect x="30" y="24" width="900" height="132" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="2"/>
  <rect x="48" y="38" width="150" height="24" rx="12" fill="#4F46E5"/>
  <text x="62" y="55" class="tag">BRAIN · Claude Code</text>
  <text x="214" y="56" class="h">skill: mobile-audit</text>
  <rect x="52" y="76" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="66" y="100" class="h">Planner</text>
  <text x="66" y="122" class="s">attack surface → plan, you approve</text>
  <rect x="276" y="76" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="290" y="100" class="h">Worker</text>
  <text x="290" y="122" class="s">reads real code, records findings</text>
  <rect x="500" y="76" width="200" height="62" rx="10" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="514" y="100" class="h">Verifier</text>
  <text x="514" y="122" class="s">switches sides, re-checks each</text>
  <line x1="252" y1="107" x2="274" y2="107" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="476" y1="107" x2="498" y2="107" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="724" y="76" width="188" height="62" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-dasharray="5 4"/>
  <text x="738" y="98" class="s">attacker models</text>
  <text x="738" y="116" class="xs">other app · deep link</text>
  <text x="738" y="132" class="xs">network · lost / rooted phone</text>

  <!-- MCP -->
  <line x1="420" y1="158" x2="420" y2="196" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="196" x2="540" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="183" class="xs">tool calls (MCP, stdio)</text>
  <text x="552" y="183" class="xs">results</text>

  <!-- 손발: MCP 서버 -->
  <rect x="30" y="200" width="900" height="330" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <rect x="48" y="214" width="236" height="24" rx="12" fill="#D97706"/>
  <text x="62" y="231" class="tag">HANDS · cotcha-pinch MCP</text>
  <text x="300" y="232" class="note">reads source only, never builds or runs the app</text>

  <rect x="48" y="252" width="200" height="176" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="62" y="276" class="h">① load_app</text>
  <text x="62" y="300" class="s">folder or Git URL</text>
  <text x="62" y="324" class="s">detects the platform:</text>
  <text x="62" y="346" class="xs">Android · AndroidManifest.xml,</text>
  <text x="62" y="362" class="xs">  build.gradle(.kts)</text>
  <text x="62" y="384" class="xs">iOS · Info.plist, *.xcodeproj,</text>
  <text x="62" y="400" class="xs">  Podfile, Package.swift</text>

  <rect x="264" y="252" width="208" height="176" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="278" y="276" class="h">② config checks</text>
  <text x="278" y="300" class="s">no parser needed</text>
  <text x="278" y="324" class="xs">AndroidManifest.xml: exported,</text>
  <text x="278" y="340" class="xs">  debuggable, allowBackup, cleartext</text>
  <text x="278" y="362" class="xs">network_security_config.xml</text>
  <text x="278" y="384" class="xs">Info.plist: ATS exceptions,</text>
  <text x="278" y="400" class="xs">  URL schemes · *.entitlements</text>

  <rect x="488" y="252" width="230" height="176" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="502" y="276" class="h">③ code graph</text>
  <text x="502" y="300" class="s">entry points → calls → sinks</text>
  <text x="502" y="324" class="xs">Java · Kotlin: cotcha-trail engine</text>
  <text x="502" y="346" class="xs">  (call graph) · Swift, Obj-C:</text>
  <text x="502" y="362" class="xs">  line rules first (iOS, next)</text>
  <text x="502" y="384" class="xs">entry: exported components, deep</text>
  <text x="502" y="400" class="xs">  links, URL schemes, JS bridges</text>

  <rect x="734" y="252" width="178" height="176" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="748" y="276" class="h">④ dependencies</text>
  <text x="748" y="300" class="s">known CVEs (OSV)</text>
  <text x="748" y="324" class="xs">Gradle · version catalogs</text>
  <text x="748" y="340" class="xs">  · lockfiles</text>
  <text x="748" y="362" class="xs">CocoaPods, SwiftPM</text>
  <text x="748" y="378" class="xs">  (planned)</text>
  <text x="748" y="400" class="xs">sends name + version only</text>

  <rect x="48" y="444" width="420" height="68" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="62" y="468" class="h">⑤ read_file · grep_code · get_callers</text>
  <text x="62" y="492" class="xs">scoped to the app folder; secrets are masked in output</text>
  <rect x="488" y="444" width="424" height="68" rx="10" fill="#FFFFFF" stroke="#FCD34D"/>
  <text x="502" y="468" class="h">⑥ record_finding · submit_verdict</text>
  <text x="502" y="492" class="xs">~/.sherlock-phones/findings/&lt;app&gt;.json, with commit</text>

  <!-- 결과 -->
  <line x1="480" y1="530" x2="480" y2="566" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="30" y="570" width="580" height="104" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <rect x="48" y="584" width="104" height="24" rx="12" fill="#059669"/>
  <text x="62" y="601" class="tag">REPORT</text>
  <text x="168" y="602" class="h">export_report</text>
  <text x="48" y="632" class="s">Markdown · SARIF 2.1.0 (GitHub code scanning)</text>
  <text x="48" y="656" class="s">each finding mapped to OWASP Mobile Top 10 + MASVS</text>

  <rect x="630" y="570" width="300" height="104" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <rect x="648" y="584" width="118" height="24" rx="12" fill="#475569"/>
  <text x="662" y="601" class="tag">BENCHMARK</text>
  <text x="648" y="632" class="s">sample Android / iOS apps</text>
  <text x="648" y="656" class="s">+ answer keys → score.py</text>
</svg>
